# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = { glob = ["_deps/**", "_build/**", ".venv/**"] }

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", priority = 0 },
  { id = "end-of-file-fixer", priority = 0 },
  { id = "check-toml", priority = 0 },
  { id = "check-yaml", priority = 0 },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "clang-format-check",
    name = "clang-format check",
    language = "system",
    entry = "clang-format --dry-run --Werror",
    files = { glob = ["src/**/*.cpp", "src/**/*.h"] },
    types_or = ["c", "c++"],
    priority = 10,
  },
  {
    id = "ruff-format-check",
    name = "ruff format check",
    language = "system",
    entry = "uv run ruff format --check",
    files = '\.py$',
    priority = 10,
  },
  {
    id = "ty-check",
    name = "ty check",
    language = "system",
    entry = "uv run ty check",
    pass_filenames = false,
    always_run = true,
    priority = 20,
  },
]
